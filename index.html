<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimório de Campanha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h2>GRIMÓRIO DE CAMPANHA</h2>
    </header>

    <main>
        <section class="hero">
            <h1>Bem-vindo ao acervo de pesquisa dos Marcados!</h1>
            <h2>Prepara seus dados!</h2>
        </section>

        <section class="characters">
            <p>Conheça nossos heróis:</p>
        </section>

        <section class="search">
            <h2>Consulte os pergaminhos:</h2>
            
            <div class="search-area">
                <aside class="search-option">
                    <button class="btn-option">Classes</button>
                    <button class="btn-option">Espécies</button>
                    <button class="btn-option active">Magias</button>
                    <button class="btn-option">Criaturas</button>
                    <button class="btn-option">Itens</button>
                </aside>

                <div class="search-bar">
                    <label for="search-field">O que você procura?</label>
                    <div class="input-container">
                        <input type="text" id="search-field" placeholder="Ex: fireball...">
                        <button id="btn-search">Buscar</button>
                    </div>
                </div>

                <div class="grid-spacer"></div>
            </div>
        </section>

        <div id="result"></div>
    </main>

    <footer>
        <p>RPG Marcados - desde 2023</p>
        <p>Todos os direitos reservados</p>
        <p>Desenvolvido para curso de dev Full Stack +prati</p>
        <p>Contato - GitHub</p>
    </footer>

</body>
</html>
